<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureBank | Fraud Analyst AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: Inter, sans-serif; }

    body {
      background: #070d1a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Top bar ── */
    header {
      width: 100%;
      padding: 16px 32px;
      background: rgba(11,23,48,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e3050;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 9px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: grid; place-items: center;
      font-weight: 800; font-size: 18px; color: #fff;
    }
    .brand-name { font-size: 15px; font-weight: 700; color: #fff; }
    .brand-sub  { font-size: 10px; color: #607090; letter-spacing: 1px; text-transform: uppercase; }
    .status-pill {
      display: flex; align-items: center; gap: 7px;
      background: #0f2a1a; border: 1px solid #1a4530;
      border-radius: 20px; padding: 6px 14px; font-size: 12px; color: #4ade80;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80;
           box-shadow: 0 0 0 4px rgba(74,222,128,0.2); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── Main chat area ── */
    main {
      flex: 1;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 16px;
    }

    /* ── Quick prompts ── */
    .quick-prompts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .qp-btn {
      background: #111c35;
      border: 1px solid #1e3050;
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 12px;
      color: #a0aec0;
      cursor: pointer;
      transition: all .2s;
    }
    .qp-btn:hover { background: #1a2e55; color: #fff; border-color: #3b82f6; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      min-height: 300px;
      max-height: calc(100vh - 320px);
      padding-right: 4px;
    }
    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #1e3050; border-radius: 4px; }

    .msg {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: fadeUp .25s ease;
    }
    @keyframes fadeUp { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }

    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 14px; font-weight: 700;
    }
    .msg.bot  .avatar { background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff; }
    .msg.user .avatar { background: #1e3050; color: #7ea8e0; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg.bot  .bubble {
      background: #111c35;
      border: 1px solid #1e3050;
      border-top-left-radius: 4px;
      color: #d1daf0;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      border-top-right-radius: 4px;
      color: #fff;
    }

    /* action pill inside bot bubble */
    .action-pill {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .action-pill.block  { background:#2d1515; color:#f87171; border:1px solid #5c2020; }
    .action-pill.hold   { background:#2a1f0a; color:#fbbf24; border:1px solid #5a3c0a; }
    .action-pill.approve{ background:#0a1f14; color:#4ade80; border:1px solid #0f3d20; }

    /* sources */
    .sources {
      margin-top: 8px;
      font-size: 10px;
      color: #4a6080;
    }

    /* typing indicator */
    .typing .bubble { padding: 14px 16px; }
    .typing-dots { display: flex; gap: 5px; align-items: center; }
    .typing-dots span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #3b82f6; opacity: .6;
      animation: blink 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }

    /* ── Input area ── */
    .input-area {
      background: #0d1830;
      border: 1px solid #1e3050;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      position: sticky;
      bottom: 16px;
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 14px;
      font-family: Inter, sans-serif;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }
    #userInput::placeholder { color: #3a5070; }
    #sendBtn {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border: none;
      cursor: pointer;
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: opacity .2s;
    }
    #sendBtn:disabled { opacity: .4; cursor: default; }
    #sendBtn svg { width: 18px; height: 18px; fill: #fff; }

    /* ── Session + API bar ── */
    .meta-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #4a6080;
    }
    .meta-bar input {
      background: #111c35;
      border: 1px solid #1e3050;
      border-radius: 7px;
      padding: 5px 9px;
      color: #7ea8e0;
      font-size: 11px;
      width: 180px;
    }
    .meta-bar label { white-space: nowrap; }
    #clearBtn {
      margin-left: auto;
      background: transparent;
      border: 1px solid #1e3050;
      border-radius: 7px;
      padding: 5px 10px;
      color: #4a6080;
      font-size: 11px;
      cursor: pointer;
    }
    #clearBtn:hover { color: #f87171; border-color: #5c2020; }

    /* ── Welcome card ── */
    .welcome {
      background: linear-gradient(135deg, #0d1f3d, #112340);
      border: 1px solid #1e3a60;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }
    .welcome h2 { font-size: 22px; margin-bottom: 10px; color: #7eb3f0; }
    .welcome p  { font-size: 13px; color: #607090; max-width: 480px; margin: 0 auto; line-height: 1.6; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">S</div>
    <div>
      <div class="brand-name">SecureBank</div>
      <div class="brand-sub">Fraud Analyst AI</div>
    </div>
  </div>
  <div class="status-pill">
    <div class="dot"></div>
    Agent online · Groq AI
  </div>
</header>

<main>
  <!-- Meta bar: session + API URL -->
  <div class="meta-bar">
    <label>Session ID:</label>
    <input type="text" id="sessionId" value="demo-session-1" placeholder="session id">
    <label>API:</label>
    <input type="text" id="apiBase" value="http://localhost:8000" placeholder="http://localhost:8000">
    <button id="clearBtn" onclick="clearChat()">Clear chat</button>
  </div>

  <!-- Quick prompts -->
  <div class="quick-prompts">
    <button class="qp-btn" onclick="sendQuick('Show me the riskiest transactions today')">🔴 Riskiest today</button>
    <button class="qp-btn" onclick="sendQuick('What is the current fraud rate?')">📊 Fraud rate</button>
    <button class="qp-btn" onclick="sendQuick('List unresolved high-risk alerts')">🚨 Open alerts</button>
    <button class="qp-btn" onclick="sendQuick('Should I approve or block the latest flagged transaction?')">⚖️ Recommend action</button>
    <button class="qp-btn" onclick="sendQuick('Explain how the fraud detection model works')">🧠 How it works</button>
  </div>

  <!-- Chat messages -->
  <div id="messages">
    <div class="welcome">
      <h2>🛡️ Fraud Analyst Assistant</h2>
      <p>Ask me about transactions, fraud alerts, or risk patterns.
         I use live data from your SecureBank database to give factual, actionable answers.</p>
    </div>
  </div>

  <!-- Input area -->
  <div class="input-area">
    <textarea id="userInput" rows="1" placeholder="Ask: Why was TXN-84A21 blocked? or Show top 5 risky transactions..."></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</main>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function getBase()    { return document.getElementById('apiBase').value.replace(/\/$/, ''); }
  function getSession() { return document.getElementById('sessionId').value || 'demo-session-1'; }

  function appendMsg(role, text, action, sources) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;

    const av = document.createElement('div');
    av.className = 'avatar';
    av.textContent = role === 'user' ? 'You' : 'AI';

    const bub = document.createElement('div');
    bub.className = 'bubble';
    bub.textContent = text;

    if (action) {
      const pill = document.createElement('div');
      const cls  = action.toLowerCase().includes('block') ? 'block'
                 : action.toLowerCase().includes('approve') ? 'approve' : 'hold';
      pill.className = 'action-pill ' + cls;
      pill.textContent = '⚡ Suggested: ' + action;
      bub.appendChild(document.createElement('br'));
      bub.appendChild(pill);
    }
    if (sources && sources.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.textContent = 'Sources: ' + sources.join(', ');
      bub.appendChild(s);
    }

    div.appendChild(av);
    div.appendChild(bub);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot typing';
    div.id = 'typing';
    div.innerHTML = `<div class="avatar">AI</div>
      <div class="bubble"><div class="typing-dots">
        <span></span><span></span><span></span>
      </div></div>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    appendMsg('user', text);
    showTyping();

    try {
      const res = await fetch(getBase() + '/api/agent/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: getSession(), message: text })
      });

      if (!res.ok) {
        const err = await res.text();
        throw new Error(`Server ${res.status}: ${err}`);
      }

      const data = await res.json();
      removeTyping();
      appendMsg('bot', data.reply, data.action_suggestion, data.sources);

    } catch (err) {
      removeTyping();
      appendMsg('bot', '⚠️ Could not reach the backend.\n\nMake sure the FastAPI server is running:\n  cd backend\n  uvicorn main:app --reload\n\nError: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function sendQuick(text) {
    inputEl.value = text;
    sendMessage();
  }

  function clearChat() {
    messagesEl.innerHTML = `<div class="welcome">
      <h2>🛡️ Fraud Analyst Assistant</h2>
      <p>Ask me about transactions, fraud alerts, or risk patterns. I use live data from your SecureBank database to give factual, actionable answers.</p>
    </div>`;
    // Generate new session
    document.getElementById('sessionId').value = 'session-' + Math.random().toString(36).slice(2, 8);
  }
</script>
</body>
</html>
